<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTMIX Online</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        .streamlit-wrap {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100dvh + 42px);
            border: 0;
            display: block;
        }
    </style>
</head>

<body>
    <div class="streamlit-wrap">
        <iframe
            src="https://dtmixonline.streamlit.app/?embed=true"
            allow="clipboard-read; clipboard-write; fullscreen">
        </iframe>
    </div>
</body>
</html>
