<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DTMIX Online</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3f8fe;
    }

    /* Khung chứa Streamlit */
    #dtmix-wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #f3f8fe;
    }

    /* Streamlit chiếm toàn bộ màn hình */
    #dtmix-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      border: 0;
      background: #f3f8fe;
      display: block;
    }

    /*
      CHE THANH:
      "Built with Streamlit 🎈        Fullscreen"

      Thanh này cao khoảng 55px.
      Lớp này nằm BÊN NGOÀI iframe nên luôn che được.
    */
    #streamlit-bottom-mask {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 50px;
      background: #f3f8fe;
      z-index: 999999;
      border: 0;
      pointer-events: auto;
    }
  </style>
</head>

<body>

  <div id="dtmix-wrap">
    <iframe
      id="dtmix-frame"
      allow="clipboard-read; clipboard-write; fullscreen">
    </iframe>
  </div>

  <!-- Che hoàn toàn thanh Built with Streamlit / Fullscreen -->
  <div id="streamlit-bottom-mask"></div>

  <script>
    const STREAMLIT_APP = "https://dtmixonline.streamlit.app/";
    const SUPABASE_HOST = "hqkgkdszkngxtbrsadra.supabase.co";

    // Nhận query parameters do Supabase trả về
    const params = window.location.search.replace(/^\?/, "");

    // Chạy Streamlit ở chế độ embed
    let src = STREAMLIT_APP + "?embed=true";

    if (params) {
      src += "&" + params;
    }

    document.getElementById("dtmix-frame").src = src;

    // Xóa query parameters khỏi thanh địa chỉ
    // sau khi đã chuyển chúng vào Streamlit.
    if (params) {
      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );
    }

    // Streamlit chạy trong iframe.
    // Khi người dùng bấm đăng nhập Google,
    // app gửi DTMIX_OAUTH_START lên trang ngoài.
    window.addEventListener("message", (event) => {
      const data = event && event.data;

      if (
        !data ||
        data.type !== "DTMIX_OAUTH_START" ||
        typeof data.url !== "string"
      ) {
        return;
      }

      try {
        const target = new URL(data.url);

        const valid =
          target.protocol === "https:" &&
          target.hostname === SUPABASE_HOST &&
          target.pathname.startsWith("/auth/v1/authorize");

        if (!valid) {
          return;
        }

        window.location.assign(target.toString());

      } catch (e) {
        // Bỏ qua URL không hợp lệ.
      }
    });
  </script>

</body>
</html>
